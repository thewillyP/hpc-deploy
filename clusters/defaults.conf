# Sourced AFTER the cluster conf. Every value here is derived or global; a
# cluster conf overrides one only when that cluster genuinely differs.
: "${CLUSTER_USER:=${SCRATCH##*/}}"
: "${SIF_DIR:=${SCRATCH}/singularity}"
: "${LOG_DIR:=${SCRATCH}/logs}"

: "${JENKINS_IMAGE:=docker://thewillyp/jenkins-hpc:latest}"
: "${JENKINS_DATA_DIR:=${SCRATCH}/jenkins}"
: "${JENKINS_PORT:=8245}"
: "${CONTROLLER_TIME:=7-00:00:00}"
: "${CONTROLLER_MEM:=8G}"
: "${CONTROLLER_CPUS:=2}"