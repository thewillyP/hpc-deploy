jenkins:
  systemMessage: "hpc-deploy controller"
  numExecutors: 2
  # Reachable only via the tailnet: jenkins.sbatch binds Jenkins to 127.0.0.1
  # and tailscaled forwards inbound tunnel traffic to localhost.
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASS}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - aws:
              scope: GLOBAL
              id: "aws-credentials"
              description: "AWS -- used by jobs to read SSM"
              accessKey: "${AWS_ACCESS_KEY_ID}"
              secretKey: "${AWS_SECRET_ACCESS_KEY}"
          - usernamePassword:
              scope: GLOBAL
              id: "github-token"
              description: "GitHub PAT (public_repo) -- raises org-scan API limit from 60/hr to 5000/hr"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
          - usernamePassword:
              scope: GLOBAL
              id: "tailscale-oauth"
              description: "Tailscale OAuth client (auth_keys scope, tag:devenv)"
              username: "${TS_API_CLIENT_ID}"
              password: "${TS_API_CLIENT_SECRET}"

unclassified:
  location:
    url: "${JENKINS_URL}"

jobs:
  # Discovery, not enumeration: any repo under thewillyP containing
  # deploy/Jenkinsfile shows up automatically. Adding a project means
  # adding that file, not editing this one.
  - script: >
      organizationFolder('thewillyP') {
        description('Auto-discovered deployable repos')
        organizations {
          github {
            repoOwner('thewillyP')
            credentialsId('github-token')
            traits {
              gitHubBranchDiscovery {
                strategyId(1)
              }
            }
          }
        }
        projectFactories {
          workflowMultiBranchProjectFactory {
            scriptPath('deploy/Jenkinsfile')
          }
        }
        triggers {
          periodicFolderTrigger { interval('1d') }
        }
      }